[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xran-ransomware-lab"
version = "0.1.0"
description = "Research harness and safe Windows fixture streaming demonstration"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
native = ["numpy==2.4.6", "scipy==1.17.1", "scikit-learn==1.9.1", "ijson==3.6.0"]
research = ["xran-ransomware-lab[native]", "torch==2.15.0+cpu"]
export = ["xran-ransomware-lab[research]", "onnx==1.20.1", "onnxruntime==1.23.2"]
kaggle = ["kaggle==1.8.3"]
fast-json = ["orjson==3.11.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
