services:
  inference:
    build:
      context: .
      dockerfile: demo/windows_streaming/Dockerfile
    ports:
      - "127.0.0.1:8767:8767"
    environment:
      WINDOWS_STREAM_TOKEN: ${WINDOWS_STREAM_TOKEN:?Generate a fresh session token}
      WINDOWS_AGENT_TOKEN: ${WINDOWS_AGENT_TOKEN:?Generate a fresh agent token}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
