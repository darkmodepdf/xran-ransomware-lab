name: Research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/audit_repository.py
      - run: python scripts/verify_models.py
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.27"
          python-version: "3.11"
      - run: uv sync --locked --extra research
      - run: uv pip check
      - name: Load and verify bundled endpoint models on CPU
        run: uv run --locked --extra research python scripts/verify_models.py --load-endpoint
      - name: Full suite (Linux skips actual Windows workers; Windows runs them)
        run: uv run --locked --extra research python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --check demo/windows_streaming/static/app.js
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -File -Filter *.ps1) + @(Get-ChildItem -Recurse -File -Filter *.ps1 -Path helpers,demo/windows_streaming)
          $files | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f demo/windows_streaming/Dockerfile -t windows-stream-lab:ci .
